short_bio:
  <p>
  I am Tuhfatul Janan, a lecturer and researcher at Institut Ahmad Dahlan Probolinggo, Indonesia.
  </p>
  <p>
  My research interests are in mathematical modeling, biomathematics, and optimal control. My work involves using mathematical models to better understand biological systems, disease transmission, and population dynamics, including the application of optimal control methods to epidemiological problems.
  </p>

