short_bio: >-
  <p>
  I am Tuhfatul Janan, a Ph.D. candidate in the Faculty of Science and Technology at Universitas Airlangga. My research interests primarily focus on mathematical modeling, biomathematics, and optimal control.
  </p>
  <p>
  My work explores the development and application of mathematical and computational models to investigate complex biological systems and phenomena. By integrating mathematical modeling and optimal control approaches, I aim to gain quantitative insights into biological processes and develop effective strategies for addressing challenging problems in the life sciences.
  </p>
   
