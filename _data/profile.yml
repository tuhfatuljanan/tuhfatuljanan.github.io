short_bio: >-
  <p>
  I am Tuhfatul Janan, a Ph.D. candidate in the Department of Mathematics and Natural Sciences at Universitas Airlangga. My research interests are in mathematical modeling, biomathematics, and optimal control.
  </p>
  <p>
  My research involves using mathematical models to better understand biological systems, disease transmission, and population dynamics. I am particularly interested in developing mathematical models to study epidemiological problems and applying optimal control methods to understand and manage the spread of diseases.
  </p>
   
