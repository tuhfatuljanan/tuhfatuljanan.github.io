short_bio: >-
  <p>
  I am Tuhfatul Janan, a Ph.D. candidate in the Department of Mathematics and Natural Sciences at Universitas Airlangga. My research interests are in mathematical modeling, biomathematics, and optimal control. My work involves using mathematical models to better understand biological systems, disease transmission, and population dynamics, including the application of optimal control methods to epidemiological problems.
  </p>
     
